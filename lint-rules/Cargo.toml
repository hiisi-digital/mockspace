[package]
name = "mockspace-lint-rules"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "AST lint rules for mockspace workspaces"

[dependencies]
# Parse-only, and already in this workspace's lockfile through
# `mockspace-manifest`, so the pack's cdylib gains no new transitive tree. A
# hand scanner was tried first and is what the toolchain lint's tests now
# document: it read a multi-line array as an absent key, which is a silent
# false negative in exactly the direction that lint exists to catch.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The seam saved verdicts are plugged in by, which has no dependency of its own.
mockspace-verdicts = { path = "../verdicts" }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
# The one parser of a hierarchical reference path.
# FIXME(02b7c73b2e63): private, so spelled over ssh, which the anonymous launcher install cannot fetch; becomes a crates.io version once the rc is published.
letkajenkka = { git = "ssh://git@github.com/orgrinrt/letkajenkka.git", branch = "work/letkajenkka-refs" }

[dev-dependencies]
# The scrub of the environment a test runs in, the one copy of it.
mockspace-manifest = { path = "../mockspace-manifest" }
tempfile = "3"
