name: Restrict main merges to dev only

# Fails any PR that targets `main` from a head other than `dev`.
# Combine with a ruleset on `main` that requires this check to pass
# (see `scripts/rulesets/main-source-restriction.json`).
#
# Deploy: copy this file to `.github/workflows/restrict-main-merges.yml`
# in each consumer repo. Workflow runs on the repo's default branch
# (`main`) once landed there, so it must merge through the standard
# feature → dev → main flow before the corresponding ruleset on main
# can require it.

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR head is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs to main must come from dev. This PR's head is '${{ github.head_ref }}'."
            echo "::error::Open the PR against dev instead, or merge into dev first then release dev to main."
            exit 1
          fi
          echo "PR head is dev. Source-branch check passes."
