[package]
name = "cargo-mock"
version = "0.0.0"
edition = "2024"
# The one crate in this repo that publishes. The engine (`mockspace`) stays
# `publish = false`; this thin launcher git-installs the per-repo pinned
# engine itself, so it needs no version relationship to it.
publish = true
description = "Launcher for the mockspace design-round workflow engine: resolves the per-repo pinned mockspace, builds it once per version into a shared cache, and runs it from any working directory."
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/mockspace"
readme = "README.md"
categories = ["development-tools", "command-line-utilities"]
keywords = ["mockspace", "cargo-subcommand", "design-rounds", "workflow"]

# Installed as both the cargo external subcommand (`cargo mock ...` runs
# `cargo-mock`) and the short direct form (`mock ...`). `cargo install
# cargo-mock` installs both bins. Each `src/bin/*.rs` is a two-line shim over
# the library, so the two binaries share one implementation without cargo's
# "same file in multiple targets" warning.

# Curated-minimal dependencies only. The pin table is still hand-parsed (a
# handful of top-level keys), cargo's own install-root lock and atomic binary
# install cover concurrency, and the cache key uses a vendored stable FNV hash.
# The one structured file the launcher owns, the global registry, is real TOML
# with several tables, so it uses serde + toml rather than a hand-rolled parser;
# both are pulled `default-features = false` with only the features the registry
# needs, keeping the published launcher fast to install and tiny to audit.
[dependencies]
mockspace-manifest = { path = "../mockspace-manifest" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3"
