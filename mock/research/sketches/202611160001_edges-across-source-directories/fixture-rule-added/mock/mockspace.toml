project_name = "fx"
crate_prefix = "fx"
src_dirs = ["base", "sim", "render"]

# The simulation and the drawing each take the base. Nothing else crosses.
[lints.an-edge-goes-where-its-directories-allow.rule.sim-takes-base]
from = "sim"
to = "base"

[lints.an-edge-goes-where-its-directories-allow.rule.render-takes-base]
from = "render"
to = "base"

# The one rule this fixture adds to fixture-red: the drawing may take the simulation.
[lints.an-edge-goes-where-its-directories-allow.rule.render-takes-sim]
from = "render"
to = "sim"
