schema_version = "1.0"
name = "no-dyn-dispatch"
primitive = "token-scan"
description = "no runtime polymorphism via dyn / TypeId"

[config]
tokens = ["dyn ", "TypeId", "std::any", "core::any", "*const dyn", "*mut dyn", "&dyn ", "&mut dyn "]
word_boundary = false
strip_strings = true
strip_comments = true
strip_doc_comments = true

[severity]
commit = "error"
build = "error"
push = "error"

[scope]
paths = ["**/*.rs"]
