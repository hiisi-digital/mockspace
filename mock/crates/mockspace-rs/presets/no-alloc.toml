schema_version = "1.0"
name = "no-alloc"
primitive = "token-scan"
description = "no heap allocation in stack code"

[config]
tokens = ["Vec<", "Box<", "Rc<", "Arc<", "String", "vec!", "HashMap<", "BTreeMap<"]
word_boundary = false
strip_strings = true
strip_comments = true
strip_doc_comments = true

[severity]
commit = "error"
build = "error"
push = "error"

[scope]
paths = ["**/*.rs"]
exempt_paths = ["**/build.rs", "**/benches/**"]
