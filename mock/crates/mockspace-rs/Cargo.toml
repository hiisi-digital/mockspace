[package]
name = "mockspace-rs"
version = "0.1.0"
edition = "2021"
description = "Rust lint engine for mockspace. Catalog-based dispatch over 11 reusable primitives + 6 bespoke primitives. Host-side tool; not subject to no-alloc / no-std discipline."
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/mockspace"
publish = false

[dependencies]
mockspace-core = { path = "../mockspace-core" }
mockspace-config = { path = "../mockspace-config" }
mockspace-rs-attrs = { path = "../mockspace-rs-attrs" }
mockspace-template = { path = "../mockspace-template" }

# Pulled in solely to re-export `gix::ObjectId` for downstream
# crates (the `mock` CLI) that need to parse user-supplied hex
# OIDs without a direct gix dep on top of mockspace-rs. Version
# pinned to match mockspace-core so the same `ObjectId` type
# flows through the re-export chain.
# The feature list matches mockspace-core's and has to, or the two resolve to
# different gix builds and the re-exported `ObjectId` stops being one type.
# `sha1` is not optional there either; gix-hash refuses to compile without it.
gix = { version = "0.87", default-features = false, features = ["revision", "sha1"] }

# AST parsing.
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Tree-sitter (cross-language AST walk for AstNodePositionMatch primitive).
tree-sitter = "0.22"
tree-sitter-rust = "0.21"

# Catalog registration mechanism.
inventory = "0.3"

# Content hashing.
blake3 = "1"

# Pattern matching.
regex = "1"
globset = "0.4"

# Parallelism.
rayon = "1"

# Project filesystem walk.
walkdir = "2"

# Concurrency primitives.
parking_lot = "0.12"
once_cell = "1"

# Configuration / serialisation.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
