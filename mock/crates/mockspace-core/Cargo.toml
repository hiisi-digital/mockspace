[package]
name = "mockspace-core"
version = "0.1.0"
edition = "2021"
description = "Ref-based storage foundation for mockspace v2."
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/mockspace"
readme = "README.md.tmpl"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Phase 5 IO storage substrate (orphan refs per spec §19). Same version
# as homma uses for git ops to keep the workspace dep graph coherent.
# Minimal feature set: enough to open + discover + read refs/objects.
# Expanded by later Phase 5 slices as needed (network ops at the push CAS
# slice; worktree-mutation NOT planned since spec §20 forbids `git worktree`).
gix = { version = "0.66", default-features = false, features = ["revision"] }
# Cross-platform advisory file locking for the Phase 5 transition lock
# at `.git/mockspace/.lock`. fs2 wraps fcntl(F_SETLK) on POSIX and
# LockFileEx on Windows; matches the flock(2) semantics spec §24 names.
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
