[package]
name = "mockspace-registry"
version = "0.1.0"
edition = "2024"
description = "The mockspace registry: typed rows in TOML files, loaded, checked, resolved and written, on a directory or a git ref."
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/mockspace"
publish = false
workspace = "../../.."

# Usable without the mockspace engine: a tool that keeps a registry depends on this crate and on
# nothing else of mockspace but the store it writes through and the trait saved verdicts are kept by.
[dependencies]
mockspace-store = { path = "../mockspace-store" }
# The seam saved verdicts are plugged in by, shared with whatever else replays a check.
mockspace-verdicts = { path = "../../../verdicts" }
regex = { version = "1", default-features = false, features = ["std"] }
# The one parser of a hierarchical reference path, `foo::bar::baz`; private, so spelled over ssh.
letkajenkka = { git = "ssh://git@github.com/orgrinrt/letkajenkka.git", branch = "dev" }
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
mockspace-store = { path = "../mockspace-store", features = ["test-support"] }
mockspace-manifest = { path = "../../../mockspace-manifest" }

# The world the registry-on-a-ref tests share, for the crates that test against a registry.
[features]
test-support = ["mockspace-store/test-support"]
