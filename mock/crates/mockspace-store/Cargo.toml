[package]
name = "mockspace-store"
version = "0.1.0"
edition = "2021"
description = "The storage backend contract of mockspace: a directory or a git ref, written with history and moved by explicit refspec."
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/mockspace"
publish = false

# Plain git only: the crate runs the `git` command and links nothing else, so it
# needs no forge, no network library and no second implementation of the
# protocol. The workspace's v2 core links gix for local ref work; fetch and push
# are the part gix is not built for here.
[dependencies]

[dev-dependencies]
tempfile = "3"
