# Generated by mockspace. Do not edit; change [[registry.namespace]]
# in mockspace.toml and regenerate.
#
# Schemas are build output and live under target/. This file lives at the
# repository root because that is where the TOML language server looks.
#
# Schemas bind by the array-of-tables key a file declares, never by its
# path, so registry files may be nested and organised however the project
# likes, including by subject rather than by kind.

[[rule]]
include = ["mock/registry/**/*.toml"]
schema.path = "target/mockspace/registry-schemas/registry.schema.json"
