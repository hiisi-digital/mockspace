[workspace]
members = [
    ".",
    "cargo-mock",
    "mockspace-manifest",
    "lint-rules",
    "bench-core",
    "bench-harness",
    "bench-macro",
    "bench-matrix",
    "benches",
    "benches/variants/multiply-xor",
    "benches/variants/bitwise-rotate",
]

[package]
name = "mockspace"
version = "0.0.0"
edition = "2024"
publish = false
description = "Design-round workflow engine for mock workspaces"
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/mockspace"
readme = "README.md"
categories = ["development-tools", "development-tools::build-utils"]
keywords = ["design-rounds", "lints", "workflow", "mockspace"]
# The `benches/` directory at the workspace root belongs to the
# `self-bench` workspace member, not to this crate. Without this flag
# cargo's edition-2021 auto-discovery picks up `benches/src/main.rs`
# as a bench target named "src" of the root mockspace crate and tries
# to compile it against this crate's deps: which lack the
# mockspace-bench-core / mockspace-bench-harness imports the file
# actually needs. Disabling auto-discovery is the targeted fix.
autobenches = false

[[bin]]
name = "mockspace"
path = "src/main.rs"

[dependencies]
mockspace-lint-rules = { path = "lint-rules" }
mockspace-bench-harness = { path = "bench-harness" }
mockspace-manifest = { path = "mockspace-manifest" }
libloading = "0.8"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Read by `tests/a_publishing_crate_has_no_git_dependency.rs`, which parses every
# manifest in the tree. Already a normal dependency, so this adds nothing to
# resolve.
toml_edit = { version = "0.22", features = ["serde"] }

# Release profile applies workspace-wide.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
